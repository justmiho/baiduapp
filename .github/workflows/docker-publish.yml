name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'baiduapp/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  # Docker Hub 镜像名: <DockerHub 用户名>/baiduapp
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/baiduapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 自动生成镜像 tag:
      #   push main       -> latest, sha-<短提交号>
      #   push tag v1.2.3 -> 1.2.3, 1.2, sha-<短提交号>
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./baiduapp
          file: ./baiduapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ env.IMAGE_NAME }} with digest ${{ steps.build.outputs.digest }}"
